name: code_guardian_ai
description: CodeGuardian AI - Analyze. Improve. Validate. Report.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=2.19.0 <4.0.0"
  flutter: ">=3.7.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.5
  hooks_riverpod: ^2.4.10
  flutter_hooks: ^0.20.5

  # Navigation
  go_router: ^12.1.3

  # HTTP
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # UI
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.66.2
  percent_indicator: ^4.2.3
  badges: ^3.1.2
  timeago: ^3.6.1

  # Responsive
  responsive_framework: ^1.1.1

  # Utils
  equatable: ^2.0.5
  logger: ^2.1.0
  intl: ^0.18.1
  uuid: ^4.2.2

  # WebSocket
  web_socket_channel: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  mocktail: ^1.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
