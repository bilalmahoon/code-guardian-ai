version: '3.9'

services:

  # ─── PHP-FPM Application ─────────────────────────────────────────────────
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: codeguardian_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    networks:
      - codeguardian
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"

  # ─── Nginx Web Server ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: codeguardian_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - codeguardian
    depends_on:
      - app

  # ─── Queue Workers ────────────────────────────────────────────────────────
  # Worker: AI Analysis (long-running, 10-min timeout)
  worker-ai:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: codeguardian_worker_ai
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --queue=ai-analysis --sleep=3 --tries=1 --timeout=600 --memory=512
    volumes:
      - ./backend:/var/www/html
    networks:
      - codeguardian
    depends_on:
      - app

  # Worker: General jobs (default, repository-processing, notifications)
  worker-default:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: codeguardian_worker_default
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --queue=default,repository-processing,code-parsing,notifications --sleep=3 --tries=2 --timeout=300
    volumes:
      - ./backend:/var/www/html
    networks:
      - codeguardian
    depends_on:
      - app

  # Worker: Reports + Validation
  worker-reports:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: codeguardian_worker_reports
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --queue=report-generation,validation --sleep=3 --tries=2 --timeout=300
    volumes:
      - ./backend:/var/www/html
    networks:
      - codeguardian
    depends_on:
      - app

  # ─── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: codeguardian_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-codeguardian}
      POSTGRES_USER: ${DB_USERNAME:-codeguardian}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - codeguardian
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-codeguardian}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis Cache & Queue ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: codeguardian_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - codeguardian
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO Object Storage ─────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: codeguardian_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-codeguardian}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-secretkey123}
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data
    networks:
      - codeguardian

  # ─── Mailpit (local email testing) ───────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: codeguardian_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - codeguardian

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  codeguardian:
    driver: bridge
